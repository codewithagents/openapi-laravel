# Qodana: JetBrains code quality analysis for openapi-laravel.
# https://www.jetbrains.com/help/qodana/qodana-yaml.html
#
# Runs in CI (see .github/workflows/qodana.yml) in informational mode: it reports
# findings to the GitHub Security tab via SARIF and, when a QODANA_TOKEN secret is
# present, to the Qodana Cloud dashboard. It does not block merges on the first run.
version: "1.0"

# PHP linter image. Pin or float as needed; latest tracks the current release.
linter: jetbrains/qodana-php:latest

# A sensible default profile for a first pass.
profile:
  name: qodana.recommended

# Limit analysis to our own source. Everything else is noise for this package.
include:
  - name: src

# Keep generated, vendored, and fixture noise out of the report.
exclude:
  - name: All
    paths:
      - vendor
      - e2e
      - tests/Fixtures
      - build
      - docs
      # composer-unused.php references the composer-unused tool's own
      # Configuration and NamedFilter classes, which are not in this project's
      # autoload. Qodana reports them as PhpUndefinedClass / PhpUndefinedNamespace
      # false positives, so exclude the file from all inspections.
      - composer-unused.php
  # Always-bracing string interpolation ("{$x}") is our deliberate house style.
  # This inspection is purely cosmetic, so disable it project-wide.
  - name: PhpUnnecessaryCurlyVarSyntaxInspection
  # Pure noise: flags explicit (bool) casts we keep for readability.
  - name: PhpUnnecessaryBoolCastInspection
  # The emitter deliberately casts array keys to string (for example
  # `(string) $name`, `(string) $rawName`) when iterating spec-derived maps.
  # PHP coerces a numeric-string key like "200" to an int at runtime, so the
  # declared `array<string, ...>` key type is not honoured by the engine. The
  # cast restores the `list<string>` / string-key invariant the rest of the
  # emitter relies on, even though the static type already says `string`. This
  # is a deliberate runtime-safety pattern, not a redundant cast.
  - name: PhpCastIsUnnecessaryInspection
  # The format-trying loop in the RFC3339 date-time, date, and time rules is
  # intentionally duplicated across those classes. Each src/Support rule is a
  # standalone unit inlined verbatim into the consumer's own \Support namespace
  # per spec (#40). Extracting a shared helper would add another inlined file
  # and couple two otherwise self-contained rules, which breaks the inlining
  # story. The duplication is the price of keeping each rule self-contained.
  - name: DuplicatedCode
  # The remaining `(string) ...` casts the emitter keeps are load-bearing, not
  # redundant: `(string) $name` restores the string-key invariant after PHP
  # coerces a numeric-string array key (e.g. "200") to int at runtime (the same
  # rationale as PhpCastIsUnnecessaryInspection above). It guards real behaviour,
  # so this inspection is a false positive here. (A `json_encode(...) ?: $raw`
  # fallback, not a cast, now feeds the two dropped-pattern warnings.)
  - name: PhpUnnecessaryStringCast
  # PhpSameParameterValue fires on the framework-free CLI's general-purpose
  # helpers `repeatedOption()` (StandaloneApplication) and `resolveRepeatable()`
  # (CommandRequestFactory). Each is a deliberate, named, reusable seam (parse a
  # repeatable --flag from argv; resolve a repeatable flag against its config
  # key); they happen to have a single repeatable flag today. Inlining the flag
  # name would couple a generic parser to one option and hurt readability, so
  # the seam is intentional, not dead generality.
  - name: PhpSameParameterValue
    paths:
      - src/Console/StandaloneApplication.php
      - src/Console/CommandRequestFactory.php
  # bin/openapi-laravel is the package's own framework-free entry point and the
  # legitimate first-party consumer of StandaloneApplication. The class is
  # @internal by design (#69: the whole PHP class API is internal; the supported
  # interface is the CLI and the artisan command, not direct class use), so the
  # bin script using it is correct, not a violation.
  - name: PhpInternalEntityUsed
    paths:
      - bin/openapi-laravel
  # ApiError::render(Request $request): Response (#168) takes $request unused:
  # the signature IS Laravel's exception-handler render() contract (the
  # framework calls render($request) via method_exists on a thrown exception,
  # before it even checks Responsable), so the parameter is required by that
  # contract even though the response is built entirely from the carried body
  # and status. Dropping it would break the zero-registration self-render.
  - name: PhpUnusedParameterInspection
    paths:
      - src/Support/ApiError.php
  # The Clover report fed to Qodana (#89) comes from the FAST suite only
  # (--exclude-group=slow), so the slow corpus gate (ReaderCorpusBaselineTest
  # runs the parser/emitter over all 135 specs) never contributes coverage to
  # the report. The lines that gate alone exercises then show up as
  # "uncovered" in Qodana even though the full `composer test` run hits them
  # and the dedicated 100% line-coverage gate (`composer test:type`) enforces
  # them. Running the full slow suite under coverage in this informational
  # workflow would roughly triple its runtime for no signal we do not already
  # have, so this inspection is pure noise here.
  - name: PhpCoverageInspection
