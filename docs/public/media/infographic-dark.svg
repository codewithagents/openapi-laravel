<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" width="880" height="530" role="img" aria-label="Flow diagram: your OpenAPI spec runs through openapi:generate, producing Data classes, validation rules, enums and a controller scaffold. You write only business logic in your own files. openapi:check in CI exits 0 when in sync and exits 1 on drift; regenerating leaves your logic untouched.">
  <title>openapi-laravel: from OpenAPI spec to typed Laravel code, with a CI drift guard</title>

  <!-- palette (dark, for #0d1117): text #e6edf3, secondary #8b949e, box fill #161b22, box stroke #30363d,
       accent red #ff2d20 (generate only), human blue #58a6ff on #11243e, green #3fb950, amber #d29922 -->

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- ===== row 1, beat 1: your OpenAPI spec ===== -->
  <rect x="24" y="48" width="224" height="164" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <!-- yaml document icon -->
  <path d="M113,66 h34 l12,12 v44 h-46 z" fill="#21262d" stroke="#8b949e" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M147,66 v12 h12" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="121" y1="92" x2="151" y2="92" stroke="#6e7681" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="121" y1="102" x2="145" y2="102" stroke="#6e7681" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="121" y1="112" x2="151" y2="112" stroke="#6e7681" stroke-width="1.8" stroke-linecap="round"/>
  <text x="136" y="156" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e6edf3">Your OpenAPI spec</text>
  <text x="136" y="186" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#8b949e">openapi.yaml</text>

  <line x1="254" y1="130" x2="272" y2="130" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ===== row 1, beat 2a: the generate command (single red accent) ===== -->
  <rect x="284" y="99" width="244" height="62" rx="31" fill="#2d1614" stroke="#ff2d20" stroke-width="1.5"/>
  <text x="406" y="137" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" font-weight="600" fill="#ff7b72">openapi:generate</text>

  <line x1="534" y1="130" x2="552" y2="130" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ===== row 1, beat 2b: what gets generated ===== -->
  <rect x="564" y="48" width="292" height="164" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="586" y="84" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf3">Generated for you</text>
  <rect x="586" y="103" width="9" height="9" rx="2" fill="#8b949e"/>
  <text x="604" y="112" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" fill="#8b949e">Data classes</text>
  <rect x="586" y="131" width="9" height="9" rx="2" fill="#8b949e"/>
  <text x="604" y="140" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" fill="#8b949e">Validation rules</text>
  <rect x="586" y="159" width="9" height="9" rx="2" fill="#8b949e"/>
  <text x="604" y="168" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" fill="#8b949e">Enums</text>
  <rect x="586" y="187" width="9" height="9" rx="2" fill="#8b949e"/>
  <text x="604" y="196" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" fill="#8b949e">Controller scaffold</text>

  <!-- snake connector down into row 2 -->
  <line x1="710" y1="218" x2="710" y2="312" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ===== row 2, beat 3: the human's box ===== -->
  <rect x="540" y="322" width="316" height="164" rx="12" fill="#11243e" stroke="#1f6feb" stroke-width="1.5"/>
  <!-- pencil icon -->
  <g stroke-linejoin="round">
    <path d="M585,340 l10,10 l-6,6 l-10,-10 z" fill="#6e7681" stroke="#8b949e" stroke-width="1.2"/>
    <path d="M579,346 l10,10 l-15,15 l-10,-10 z" fill="#58a6ff" stroke="#58a6ff" stroke-width="1.2"/>
    <path d="M564,361 l10,10 l-14,4 z" fill="#c9d1d9" stroke="#8b949e" stroke-width="1.2"/>
  </g>
  <text x="610" y="358" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf3">You write only</text>
  <text x="610" y="382" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf3">business logic</text>
  <text x="560" y="426" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#c9d1d9">In your own files.</text>
  <text x="560" y="450" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#c9d1d9">The generator never touches them.</text>

  <!-- snake continues right to left -->
  <line x1="534" y1="404" x2="512" y2="404" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ===== row 2, beat 4: the CI guard ===== -->
  <rect x="160" y="322" width="340" height="164" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="184" y="358" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" font-weight="600" fill="#e6edf3">openapi:check</text>
  <rect x="344" y="340" width="34" height="24" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="361" y="357" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b949e">CI</text>
  <!-- branch fork -->
  <path d="M200,368 v35 q0,9 9,9 h9" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M200,403 v46 q0,9 9,9 h9" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- in sync row -->
  <path d="M231,412 l6,6.5 l10.5,-12.5" fill="none" stroke="#3fb950" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="262" y="418" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16.5" font-weight="600" fill="#3fb950">in sync: exit 0</text>
  <!-- drift row -->
  <path d="M238,448 v11 M238,465 v2" fill="none" stroke="#d29922" stroke-width="3.5" stroke-linecap="round"/>
  <text x="262" y="464" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16.5" font-weight="600" fill="#d29922">drift: exit 1</text>

  <!-- loop arrow: drift goes back to generate, your logic survives -->
  <path d="M406,322 V170" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="392" y="270" text-anchor="end" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" fill="#8b949e">regenerate, your logic is untouched</text>
</svg>
