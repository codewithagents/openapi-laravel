<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Flow diagram: your OpenAPI spec runs through openapi:generate, producing Data classes, validation rules, enums and a controller scaffold. You write only business logic in your own files. openapi:check in CI exits 0 when in sync and exits 1 on drift; regenerating leaves your logic untouched.">
  <title>openapi-laravel: from OpenAPI spec to typed Laravel code, with a CI drift guard</title>

  <!-- palette (dark, for #0d1117): text #e6edf3, secondary #8b949e, box fill #161b22, box stroke #30363d,
       accent red #ff2d20 (generate only), human blue #58a6ff on #11243e, green #3fb950, amber #d29922 -->

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- ===== beat 1: your OpenAPI spec ===== -->
  <rect x="24" y="72" width="164" height="126" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <!-- yaml document icon -->
  <path d="M88,84 h26 l10,10 v34 h-36 z" fill="#21262d" stroke="#8b949e" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M114,84 v10 h10" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="95" y1="104" x2="117" y2="104" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="95" y1="112" x2="113" y2="112" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="95" y1="120" x2="117" y2="120" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round"/>
  <text x="106" y="160" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Your OpenAPI spec</text>
  <text x="106" y="180" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#8b949e">openapi.yaml</text>

  <line x1="190" y1="135" x2="212" y2="135" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== beat 2a: the generate command (single red accent) ===== -->
  <rect x="220" y="109" width="186" height="52" rx="26" fill="#2d1614" stroke="#ff2d20" stroke-width="1.5"/>
  <text x="313" y="140" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="600" fill="#ff7b72">openapi:generate</text>

  <line x1="408" y1="135" x2="430" y2="135" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== beat 2b: what gets generated ===== -->
  <rect x="438" y="72" width="232" height="126" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="456" y="98" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3">Generated for you</text>
  <rect x="456" y="111" width="7" height="7" rx="1.5" fill="#8b949e"/>
  <text x="470" y="118" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e">Data classes</text>
  <rect x="456" y="130" width="7" height="7" rx="1.5" fill="#8b949e"/>
  <text x="470" y="137" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e">Validation rules</text>
  <rect x="456" y="149" width="7" height="7" rx="1.5" fill="#8b949e"/>
  <text x="470" y="156" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e">Enums</text>
  <rect x="456" y="168" width="7" height="7" rx="1.5" fill="#8b949e"/>
  <text x="470" y="175" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e">Controller scaffold</text>

  <line x1="672" y1="135" x2="694" y2="135" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== beat 3: the human's box ===== -->
  <rect x="702" y="72" width="228" height="126" rx="10" fill="#11243e" stroke="#1f6feb" stroke-width="1.5"/>
  <!-- pencil icon -->
  <g stroke-linejoin="round">
    <path d="M734,86 l8,8 l-5,5 l-8,-8 z" fill="#6e7681" stroke="#8b949e" stroke-width="1"/>
    <path d="M729,91 l8,8 l-12,12 l-8,-8 z" fill="#58a6ff" stroke="#58a6ff" stroke-width="1"/>
    <path d="M717,103 l8,8 l-11,3 z" fill="#c9d1d9" stroke="#8b949e" stroke-width="1"/>
  </g>
  <text x="752" y="100" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3">You write only</text>
  <text x="752" y="118" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3">business logic</text>
  <text x="720" y="150" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">In your own files.</text>
  <text x="720" y="168" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">The generator never touches them.</text>

  <line x1="932" y1="135" x2="954" y2="135" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== beat 4: the CI guard ===== -->
  <rect x="962" y="72" width="214" height="126" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="980" y="99" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="600" fill="#e6edf3">openapi:check</text>
  <rect x="1092" y="85" width="26" height="17" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="1105" y="97.5" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#8b949e">CI</text>
  <!-- branch fork -->
  <path d="M990,108 v22 q0,6 6,6 h6" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M990,130 v28 q0,6 6,6 h6" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- in sync row -->
  <path d="M1014,136 l3.5,4 l7,-8" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1032" y="140" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#3fb950">in sync: exit 0</text>
  <!-- drift row -->
  <path d="M1019,159 v7 M1019,170.5 v1.5" fill="none" stroke="#d29922" stroke-width="2.5" stroke-linecap="round"/>
  <text x="1032" y="168" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#d29922">drift: exit 1</text>

  <!-- loop arrow: drift goes back to generate, your logic survives -->
  <path d="M1040,198 v32 q0,8 -8,8 h-711 q-8,0 -8,-8 v-59" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="676" y="231" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">regenerate, your logic is untouched</text>

  <!-- caption -->
  <text x="600" y="294" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-style="italic" fill="#8b949e">The spec is the source of truth. The generator owns its files, you own yours.</text>
</svg>
