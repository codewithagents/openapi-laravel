# Static serving for the built SPA. Single-page app, so unknown paths fall back
# to index.html. This nginx never proxies the API: the SPA's fetch runs in the
# user's browser and talks to the host-mapped backend port directly (see
# VITE_API_BASE, baked in at build time).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
