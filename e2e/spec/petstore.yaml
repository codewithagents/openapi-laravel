  requestBodies:
    Pet:
      description: Pet object that needs to be added to the store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Pet'
        application/xml:
          schema:
            $ref: '#/components/schemas/Pet'
    UserArray:
      description: List of user object
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/User'
    LabRefBody:
      description: A component request body that wraps a schema $ref (#110).
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LabRefPayload'
  responses:
    LabRefResponse:
      description: A component response that wraps a schema $ref (#116).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LabRefPayload'
  securitySchemes:
    petstore_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://petstore3.swagger.io/oauth/authorize
          scopes:
            "write:pets": modify pets in your account
            "read:pets": read your pets
    api_key:
      type: apiKey
      name: api_key
      in: header
    pet_upload_key:
      type: apiKey
      name: X-API-Key
      in: header
