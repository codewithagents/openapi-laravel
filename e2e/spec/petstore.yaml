          format: date
        moment:
          type: string
          format: date-time
        clock:
          type: string
          format: time
        span:
          type: string
          format: duration
        mail:
          type: string
          format: email
        identifier:
          type: string
          format: uuid
        host:
          type: string
          format: hostname
    LabEnumConst:
      type: object
      required:
        - color
        - version
      properties:
        color:
          type: string
          enum:
            - red
            - green
            - blue
        version:
