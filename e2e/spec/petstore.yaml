openapi: 3.0.4
info:
  title: Swagger Petstore - OpenAPI 3.0
  description: |-
    This is a sample Pet Store Server based on the OpenAPI 3.0 specification.  You can find out more about
    Swagger at [https://swagger.io](https://swagger.io). In the third iteration of the pet store, we've switched to the design first approach!
    You can now help us improve the API whether it's by making changes to the definition itself or to the code.
    That way, with time, we can improve the API in general, and expose some of the new features in OAS3.

    Some useful links:
    - [The Pet Store repository](https://github.com/swagger-api/swagger-petstore)
    - [The source API definition for the Pet Store](https://github.com/swagger-api/swagger-petstore/blob/master/src/main/resources/openapi.yaml)
  termsOfService: https://swagger.io/terms/
  contact:
    email: apiteam@swagger.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.27
externalDocs:
  description: Find out more about Swagger
  url: https://swagger.io
servers:
  - url: https://petstore3.swagger.io/api/v3
tags:
  - name: pet
    description: Everything about your Pets
    externalDocs:
      description: Find out more
      url: https://swagger.io
  - name: store
    description: Access to Petstore orders
    externalDocs:
      description: Find out more about our store
      url: https://swagger.io
  - name: user
    description: Operations about user
  - name: lab
    description: >-
      Stateless validation and serialization lab. Each endpoint validates a
      crafted request body against the spec-derived rules() and echoes the
      hydrated object back, so the e2e suite can prove the full runtime feature
      matrix (validation, hydration, composition) without any persistence.
paths:
  /pet:
    put:
      tags:
        - pet
      summary: Update an existing pet.
      description: Update an existing pet by Id.
      operationId: updatePet
      requestBody:
        description: Update an existent pet in the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
          application/xml:
            schema:
              $ref: '#/components/schemas/Pet'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Pet'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
            application/xml:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid ID supplied
        '404':
          description: Pet not found
        '422':
          description: Validation exception
        default:
          description: Unexpected error
      security:
        - petstore_auth:
            - write:pets
            - read:pets
    post:
      tags:
        - pet
      summary: Add a new pet to the store.
      description: Add a new pet to the store.
      operationId: addPet
      requestBody:
        description: Create a new pet in the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
          application/xml:
            schema:
              $ref: '#/components/schemas/Pet'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Pet'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
            application/xml:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid input
        '422':
          description: Validation exception
        default:
          description: Unexpected error
      security:
        - petstore_auth:
            - write:pets
            - read:pets
  /pet/findByStatus:
    get:
      tags:
        - pet
      summary: Finds Pets by status.
      description: Multiple status values can be provided with comma separated strings.
      operationId: findPetsByStatus
      parameters:
        - name: status
          in: query
          description: Status values that need to be considered for filter
          required: true
          explode: true
          schema:
            type: string
            default: available
            enum:
              - available
              - pending
              - sold
      responses:
        '200':
          description: successful operation
          headers:
            X-Total-Count:
              description: Total number of pets matching the status filter.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid status value
        default:
          description: Unexpected error
      security:
        - petstore_auth:
            - write:pets
            - read:pets
  /pet/findByTags:
    get:
      tags:
        - pet
      summary: Finds Pets by tags.
      description: Multiple tags can be provided with comma separated strings. Use tag1, tag2, tag3 for testing.
      operationId: findPetsByTags
      parameters:
        - name: tags
          in: query
          description: Tags to filter by
          required: true
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid tag value
        default:
          description: Unexpected error
      security:
        - petstore_auth:
            - write:pets
            - read:pets
  /pet/{petId}:
    get:
      tags:
        - pet
      summary: Find pet by ID.
      description: Returns a single pet.
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          description: ID of pet to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
            application/xml:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid ID supplied
        '404':
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetNotFoundError'
        default:
          description: Unexpected error
      security:
        - api_key: []
        - petstore_auth:
            - write:pets
            - read:pets
    post:
      tags:
        - pet
      summary: Updates a pet in the store with form data.
      description: Updates a pet resource based on the form data.
      operationId: updatePetWithForm
      parameters:
        - name: petId
          in: path
          description: ID of pet that needs to be updated
          required: true
          schema:
            type: integer
            format: int64
        - name: name
          in: query
          description: Name of pet that needs to be updated
          schema:
            type: string
        - name: status
          in: query
          description: Status of pet that needs to be updated
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
            application/xml:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid input
        default:
          description: Unexpected error
      security:
        - petstore_auth:
            - write:pets
            - read:pets
    delete:
      tags:
        - pet
      summary: Deletes a pet.
      description: Delete a pet.
      operationId: deletePet
      parameters:
        - name: api_key
          in: header
          description: ''
          required: false
          schema:
            type: string
        - name: petId
          in: path
          description: Pet id to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Pet deleted
        '400':
          description: Invalid pet value
        default:
          description: Unexpected error
      security:
        - petstore_auth:
            - write:pets
            - read:pets
  /pet/{petId}/uploadImage:
    post:
      tags:
        - pet
      summary: Uploads an image.
      description: Upload image of the pet.
      operationId: uploadFile
      parameters:
        - name: petId
          in: path
          description: ID of pet to update
          required: true
          schema:
            type: integer
            format: int64
        - name: additionalMetadata
          in: query
          description: Additional Metadata
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  contentMediaType: image/png
                caption:
                  type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: No file uploaded
        '404':
          description: Pet not found
        default:
          description: Unexpected error
      security:
        - pet_upload_key: []
  /store/inventory:
    get:
      tags:
        - store
      summary: Returns pet inventories by status.
      description: Returns a map of status codes to quantities.
      operationId: getInventory
      x-swagger-router-controller: OrderController
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
        default:
          description: Unexpected error
      security:
        - api_key: []
  /store/order:
    post:
      tags:
        - store
      summary: Place an order for a pet.
      description: Place a new order in the store.
      x-swagger-router-controller: OrderController
      operationId: placeOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
          application/xml:
            schema:
              $ref: '#/components/schemas/Order'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid input
        '422':
          description: Validation exception
        default:
          description: Unexpected error
  /store/order/{orderId}:
    get:
      tags:
        - store
      summary: Find purchase order by ID.
      x-swagger-router-controller: OrderController
      description: For valid response try integer IDs with value <= 5 or > 10. Other values will generate exceptions.
      operationId: getOrderById
      parameters:
        - name: orderId
          in: path
          description: ID of order that needs to be fetched
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
            application/xml:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid ID supplied
        '404':
          description: Order not found
        default:
          description: Unexpected error
    delete:
      tags:
        - store
      summary: Delete purchase order by identifier.
      description: For valid response try integer IDs with value < 1000. Anything above 1000 or non-integers will generate API errors.
      x-swagger-router-controller: OrderController
      operationId: deleteOrder
      parameters:
        - name: orderId
          in: path
          description: ID of the order that needs to be deleted
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: order deleted
        '400':
          description: Invalid ID supplied
        '404':
          description: Order not found
        default:
          description: Unexpected error
  /user:
    post:
      tags:
        - user
      summary: Create user.
      description: This can only be done by the logged in user.
      x-swagger-router-controller: UserController
      operationId: createUser
      requestBody:
        description: Created user object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/xml:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
            application/xml:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: Unexpected error
  /user/createWithList:
    post:
      tags:
        - user
      summary: Creates list of users with given input array.
      description: Creates list of users with given input array.
      x-swagger-router-controller: UserController
      operationId: createUsersWithListInput
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
            application/xml:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: Unexpected error
  /user/login:
    get:
      tags:
        - user
      summary: Logs user into the system.
      description: Log into the system.
      operationId: loginUser
      parameters:
        - name: username
          in: query
          description: The user name for login
          required: false
          schema:
            type: string
        - name: password
          in: query
          description: The password for login in clear text
          required: false
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          headers:
            X-Rate-Limit:
              description: calls per hour allowed by the user
              schema:
                type: integer
                format: int32
            X-Expires-After:
              description: date in UTC when token expires
              schema:
                type: string
                format: date-time
          content:
            application/xml:
              schema:
                type: string
            application/json:
              schema:
                type: string
        '400':
          description: Invalid username/password supplied
        default:
          description: Unexpected error
  /user/logout:
    get:
      tags:
        - user
      summary: Logs out current logged in user session.
      description: Log user out of the system.
      operationId: logoutUser
      parameters: []
      responses:
        '200':
          description: successful operation
        default:
          description: Unexpected error
  /user/{username}:
    get:
      tags:
        - user
      summary: Get user by user name.
      description: Get user detail based on username.
      operationId: getUserByName
      parameters:
        - name: username
          in: path
          description: The name that needs to be fetched. Use user1 for testing
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
            application/xml:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid username supplied
        '404':
          description: User not found
        default:
          description: Unexpected error
    put:
      tags:
        - user
      summary: Update user resource.
      description: This can only be done by the logged in user.
      x-swagger-router-controller: UserController
      operationId: updateUser
      parameters:
        - name: username
          in: path
          description: name that need to be deleted
          required: true
          schema:
            type: string
      requestBody:
        description: Update an existent user in the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/xml:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: successful operation
        '400':
          description: bad request
        '404':
          description: user not found
        default:
          description: Unexpected error
    delete:
      tags:
        - user
      summary: Delete user resource.
      description: This can only be done by the logged in user.
      operationId: deleteUser
      parameters:
        - name: username
          in: path
          description: The name that needs to be deleted
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deleted
        '400':
          description: Invalid username supplied
        '404':
          description: User not found
        default:
          description: Unexpected error
  /lab/numeric:
    post:
      tags:
        - lab
      summary: Echo a numeric-constraints object.
      operationId: labNumeric
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabNumeric'
      responses:
        '200':
          description: echoed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabNumeric'
        '422':
          description: Validation exception
  /lab/string:
    post:
      tags:
        - lab
      summary: Echo a string-constraints object.
      operationId: labString
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabString'
      responses:
        '200':
          description: echoed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabString'
        '422':
          description: Validation exception
  /lab/trait-check:
    post:
      tags:
        - lab
      summary: >-
        Echo a single required, pattern-constrained code. Backs the
        output.validation_trait config proof (#83): the generated request Data
        class mixes in the consumer trait, so a missing or malformed code 422s
        with the trait's CUSTOM message rather than Laravel's default.
      operationId: labTraitCheck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabTraitCheck'
      responses:
        '200':
          description: echoed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabTraitCheck'
        '422':
          description: Validation exception
  /lab/array:
    post:
      tags:
        - lab
      summary: Echo an array-constraints object.
      operationId: labArray
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabArray'
      responses:
        '200':
          description: echoed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabArray'
        '422':
          description: Validation exception
  /lab/formats:
    post:
      tags:
        - lab
      summary: Echo a string-formats object.
      operationId: labFormats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabFormats'
      responses:
        '200':
          description: echoed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabFormats'
        '422':
          description: Validation exception
  /lab/enum-const:
    post:
      tags:
        - lab
      summary: Echo an enum and const object.
      operationId: labEnumConst
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabEnumConst'
      responses:
        '200':
          description: echoed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabEnumConst'
        '422':
          description: Validation exception
  /lab/closed:
    post:
      tags:
        - lab
      summary: Echo a closed object (additionalProperties false).
      operationId: labClosed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabClosed'
      responses:
        '200':
          description: echoed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabClosed'
        '422':
          description: Validation exception
  /lab/presence:
    post:
      tags:
        - lab
      summary: Echo a required / nullable / optional / default object.
      operationId: labPresence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabPresence'
      responses:
        '200':
          description: echoed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabPresence'
        '422':
          description: Validation exception
  /lab/map:
    post:
      tags:
        - lab
      summary: Echo a typed additionalProperties map object.
      operationId: labMap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabMap'
      responses:
        '200':
          description: echoed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabMap'
        '422':
          description: Validation exception
  /lab/union:
    post:
      tags:
        - lab
      summary: Echo a scalar oneOf union object.
      operationId: labUnion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabUnion'
      responses:
        '200':
          description: echoed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabUnion'
        '422':
          description: Validation exception
  /lab/nested:
    post:
      tags:
        - lab
      summary: Echo a nested object plus collection.
      operationId: labNested
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabNested'
      responses:
        '200':
          description: echoed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabNested'
        '422':
          description: Validation exception
  /lab/nested-variant:
    post:
      tags:
        - lab
      summary: >-
        Echo a collection whose items carry readOnly AND writeOnly properties.
        Proves the WritableData readOnly/writeOnly split recurses into a
        nested-in-collection Data class: writeOnly is accepted on create but
        omitted from the read response, readOnly is server-managed (a client
        value is ignored) inside EACH item.
      operationId: labNestedVariant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabNestedVariant'
      responses:
        '200':
          description: echoed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabNestedVariant'
        '422':
          description: Validation exception
  /lab/closed-nest:
    post:
      tags:
        - lab
      summary: >-
        Echo an object that nests a closed object (additionalProperties false)
        both as a direct property AND inside a collection. Proves the #30
        NoUnknownPropertiesRule recurses: an unknown key on the INNER object
        (property or array item) is a clean 422 keyed on the nested path.
      operationId: labClosedNest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabClosedNest'
      responses:
        '200':
          description: echoed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabClosedNest'
        '422':
          description: Validation exception
  /lab/backed-enum:
    post:
      tags:
        - lab
      summary: Echo an object carrying a backed enum.
      operationId: labBackedEnum
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabBackedEnum'
      responses:
        '200':
          description: echoed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabBackedEnum'
        '422':
          description: Validation exception
  /lab/allof:
    post:
      tags:
        - lab
      summary: Echo an allOf merged-flat object.
      operationId: labAllOf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabAllOf'
      responses:
        '200':
          description: echoed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabAllOf'
        '422':
          description: Validation exception
  /lab/shape:
    post:
      tags:
        - lab
      summary: Echo a discriminated object union (named-component form).
      operationId: labShape
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabShape'
      responses:
        '200':
          description: echoed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabShape'
        '422':
          description: Validation exception
  /lab/ref-body:
    post:
      tags:
        - lab
      summary: Echo via a component requestBodies $ref (#110).
      operationId: labRefBody
      requestBody:
        $ref: '#/components/requestBodies/LabRefBody'
      responses:
        '200':
          description: echoed via a component responses $ref (#116)
          $ref: '#/components/responses/LabRefResponse'
        '422':
          description: Validation exception
  /lab/accepted:
    post:
      tags:
        - lab
      summary: A 202 Accepted success status (exercises RespondsWithStatus).
      operationId: labAccepted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabAllOf'
      responses:
        '202':
          description: accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabAllOf'
        '422':
          description: Validation exception
  /lab/query:
    get:
      tags:
        - lab
      summary: Echo constrained query parameters (enum + min/max + pattern).
      operationId: labQuery
      parameters:
        - name: tier
          in: query
          required: true
          schema:
            type: string
            enum:
              - bronze
              - silver
              - gold
        - name: count
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: code
          in: query
          required: true
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
      responses:
        '200':
          description: echoed query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabQueryEcho'
        '422':
          description: Validation exception
  /lab/delimited-query:
    get:
      tags:
        - lab
      summary: >-
        Echo NON-EXPLODED DELIMITED array query parameters on a body-less GET
        (#132, the real-world Stripe-style filter case). The generator splits
        each delimited array in the generated fromQuery() factory BEFORE the
        array rules run, one delimiter per style: form+explode:false on COMMA
        (?csv=1,2,3), spaceDelimited on SPACE (?ssv=a b c), pipeDelimited on PIPE
        (?psv=a|b|c). The csv items carry minimum:1 maximum:100, so an
        out-of-range item 422s through the generated per-item rules, proving the
        split values really feed validation rather than being dropped. Because a
        delimited-array query class is now ADDITIVE (not container-injected) even
        on a body-less GET, the abstract method takes NO injected query param and
        carries a fromQuery($request) docblock pointer, so the split is the
        runtime-live path: it runs before validation instead of spatie validating
        the unsplit joined string first.
      operationId: labDelimitedQuery
      parameters:
        - name: csv
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
              minimum: 1
              maximum: 100
        - name: ssv
          in: query
          required: true
          style: spaceDelimited
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: psv
          in: query
          required: true
          style: pipeDelimited
          explode: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: echoed delimited query parameters (split into arrays)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabDelimitedEcho'
        '422':
          description: Validation exception
  /lab/deep-filter:
    get:
      tags:
        - lab
      summary: >-
        Echo a style: deepObject OBJECT query parameter on a body-less GET
        (#131, the real-world Stripe-style ?filter[gte]=10&filter[lte]=20 case).
        The generator synthesizes the deepObject `filter` object into the
        generated LabDeepFilterQueryData class as a NESTED object property with
        DOTTED nested rules (filter.gte min:0, filter.lte max:100,
        filter.color enum). PHP parses the bracketed query keys natively into a
        nested array, so unlike the #132 delimited-array case no split is needed
        and the param stays container-INJECTABLE on a body-less GET. Proves both
        that valid nested values hydrate and round-trip and that an out-of-range
        nested value 422s keyed on the dotted path (filter.gte).
      operationId: labDeepFilter
      parameters:
        - name: filter
          in: query
          required: true
          style: deepObject
          explode: true
          schema:
            type: object
            required:
              - gte
              - lte
            properties:
              gte:
                type: integer
                minimum: 0
              lte:
                type: integer
                maximum: 100
              color:
                type: string
                enum:
                  - red
                  - green
                  - blue
      responses:
        '200':
          description: echoed deepObject query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabDeepFilterEcho'
        '422':
          description: Validation exception
  /lab/path/{score}:
    get:
      tags:
        - lab
      summary: Echo a constrained path parameter (issue #113 residual).
      operationId: labPath
      parameters:
        - name: score
