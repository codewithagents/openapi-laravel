    LabMap:
      type: object
      required:
        - label
      properties:
        label:
          type: string
        counts:
          type: object
          additionalProperties:
            type: integer
    LabUnion:
      type: object
      required:
        - value
      properties:
        value:
          oneOf:
            - type: string
            - type: integer
    LabInner:
      type: object
      required:
        - label
      properties:
        label:
          type: string
        weight:
