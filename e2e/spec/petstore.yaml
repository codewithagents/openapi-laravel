  /lab/form-body:
    post:
      tags:
        - lab
      summary: >-
        Echo an application/x-www-form-urlencoded OBJECT request body (#130).
        The body's ONLY content type is application/x-www-form-urlencoded, and
        the generator routes it through the SAME <Operation>RequestData
        synthesizer as an inline JSON object body (#76): the controller param is
        typed LabFormBodyRequestData and the urlencoded values are validated
        like JSON (Laravel parses urlencoded into the input bag). Proves BOTH a
        valid urlencoded payload (passes, typed, round-trips) and an invalid one
        (422 from the generated rules), so the form branch of the synthesizer is
        no longer dead.
      operationId: labFormBody
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - label
                - quantity
              properties:
                label:
                  type: string
                  minLength: 3
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 99
      responses:
        '200':
          description: echoed
          content:
            application/json:
              schema:
                type: object
                properties:
                  label:
                    type: string
                  quantity:
                    type: integer
        '422':
          description: Validation exception
  /lab/inline-response:
    get:
      tags:
        - lab
      summary: >-
        Return an INLINE object success response (#129, not a component
        responses $ref). The generator synthesizes a typed
        LabInlineResponseResponseData class from the inline 200 object schema as
        the READ variant: the readOnly property (generated_at) stays in the
        typed return, the writeOnly property (internal_token) is DROPPED. Pins
        that an inline (non-$ref) object response is synthesized symmetric with
        an inline object request body (#76), distinct from the component $ref
        response covered by /lab/ref-body (#116).
      operationId: labInlineResponse
      responses:
        '200':
          description: an inline object response (READ variant drops writeOnly)
          content:
            application/json:
              schema:
                type: object
                required:
                  - label
                  - generated_at
                properties:
                  label:
                    type: string
                  generated_at:
                    type: string
                    format: date-time
                    readOnly: true
                  internal_token:
                    type: string
                    writeOnly: true
  /lab/shared-one:
