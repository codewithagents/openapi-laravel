          description: echoed with no credentials required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabSecureEcho'
  /lab/styles:
    get:
      tags:
        - lab
      summary: >-
        Non-standard query styles (deepObject object, pipeDelimited array) are
        SKIPPED with a warning and never validated (RequestDataSynthesizer
        querySkipReason residual).
      operationId: labStyles
      parameters:
        - name: filter
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              category:
                type: string
              minPrice:
                type: integer
        - name: ids
          in: query
          required: false
          style: pipeDelimited
          explode: false
          schema:
            type: array
            items:
              type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: echoed (only the supported page param is validated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabStylesEcho'
        '422':
          description: Validation exception
  /lab/cookie:
    get:
      tags:
        - lab
      summary: >-
        An in:cookie parameter is dropped with a warning and never validated
        (warnUnsupportedParameterLocations residual).
      operationId: labCookie
      parameters:
        - name: session_hint
          in: cookie
          required: true
          schema:
            type: string
            pattern: '^sess-[0-9]{4}$'
      responses:
        '200':
          description: echoed regardless of the cookie value (cookie is never validated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabCookieEcho'
  /lab/int64:
    post:
      tags:
        - lab
      summary: An int64 field carrying min/max bounds (int64 bounds degrade gracefully).
      operationId: labInt64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabInt64'
      responses:
        '200':
          description: echoed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabInt64'
        '422':
          description: Validation exception
  /lab/loose-union:
    post:
      tags:
        - lab
      summary: >-
        A oneOf of two OBJECT schemas with NO discriminator (#31): typed mixed,
        presence-only, not hydrated into a specific variant.
      operationId: labLooseUnion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabLooseUnion'
      responses:
        '200':
          description: echoed (presence-only, no variant-specific validation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabLooseUnion'
        '422':
          description: Validation exception
  /lab/dual-status:
    get:
      tags:
        - lab
      summary: >-
        Declares BOTH 200 and 202 (#64): the selected success status is the
        smallest 2xx (200), so a controller-set 202 passes through untouched.
        The 200 declares no body (typed JsonResponse, no RespondsWithStatus), so
        the controller is free to set its own status, and the generator does NOT
        rewrite it.
      operationId: labDualStatus
      responses:
        '200':
          description: the selected success status (smallest 2xx), no declared body
        '202':
          description: an alternative success status the controller may set directly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabDualStatusEcho'
  /lab/empty-map:
    get:
      tags:
        - lab
      summary: >-
        Empty-map RESPONSE serialization. Returns a LabMap whose typed
        additionalProperties map (counts) is empty. Pins that the generated
        MapObjectTransformer forces JSON object encoding on the RESPONSE side:
        an empty map serializes as {} not []. The request side is already
        covered by /lab/map and POST /pet attributes.
      operationId: labEmptyMap
      responses:
        '200':
          description: a LabMap with an empty counts map
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabMap'
  /lab/nested-binary:
    post:
      tags:
        - lab
      summary: >-
        Multipart with a binary field NESTED below the multipart root (#75
        residual). Only ROOT-level format:binary parts become UploadedFile; a
        binary string nested inside an object property stays a plain string with
        no file handling. Pins that wrapper.payload is validated/echoed as a
        plain string, not treated as an uploaded file.
      operationId: labNestedBinary
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - wrapper
              properties:
                caption:
                  type: string
                wrapper:
                  type: object
                  required:
                    - payload
                  properties:
                    payload:
                      type: string
                      format: binary
                      contentMediaType: image/png
      responses:
        '200':
          description: echoed nested-binary handling
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          description: Validation exception
components:
  schemas:
    Order:
      x-swagger-router-model: io.swagger.petstore.model.Order
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        petId:
          type: integer
          format: int64
          example: 198772
        quantity:
          type: integer
          format: int32
          example: 7
        shipDate:
          type: string
          format: date-time
        status:
          type: string
          description: Order Status
          example: approved
          enum:
            - placed
            - approved
            - delivered
        complete:
          type: boolean
      xml:
        name: order
    Category:
      x-swagger-router-model: io.swagger.petstore.model.Category
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Dogs
      xml:
        name: category
    User:
      x-swagger-router-model: io.swagger.petstore.model.User
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        username:
          type: string
          example: theUser
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: James
        email:
          type: string
          example: john@email.com
        password:
          type: string
          example: '12345'
        phone:
          type: string
          example: '12345'
        userStatus:
          type: integer
          description: User Status
          format: int32
          example: 1
      xml:
        name: user
    Tag:
      x-swagger-router-model: io.swagger.petstore.model.Tag
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      xml:
        name: tag
    Pet:
      x-swagger-router-model: io.swagger.petstore.model.Pet
      required:
        - name
        - photoUrls
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        name:
          type: string
          example: doggie
        category:
          $ref: '#/components/schemas/Category'
        photoUrls:
          type: array
          xml:
            wrapped: true
          items:
            type: string
            xml:
              name: photoUrl
        tags:
          type: array
          xml:
            wrapped: true
          items:
            $ref: '#/components/schemas/Tag'
        status:
          type: string
          description: pet status in the store
          enum:
            - available
            - pending
            - sold
        microchip_id:
          type: string
          description: >-
            Snake_case wire name mapping to a camelCase property (microchipId).
            Exercises #[MapName] round-trips in both directions.
          example: chip-abc-123
        secret_note:
          type: string
          writeOnly: true
          description: >-
            Accepted on create, never present in any read response. Exercises
            the writeOnly split into the WritableData variant.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: >-
            Set server-side on create, present in reads, ignored if a client
            sends it. Exercises the readOnly split out of the WritableData
            variant.
        weight_kg:
          type: number
          nullable: true
          description: Nullable number that stays present (as null) in responses.
        attributes:
          type: object
          additionalProperties:
            type: string
          description: A string to string map that must round-trip intact.
        external_id:
          oneOf:
            - type: string
            - type: integer
          description: >-
            An external identifier that may be a legacy numeric id or a newer
            string id. A scalar oneOf union: it round-trips cleanly and proves
            the union path end to end (object unions need a discriminator to
            auto-hydrate, a documented residual).
      xml:
        name: pet
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string
      xml:
        name: '##default'
    PetNotFoundError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    LabNumeric:
      type: object
      required:
        - bounded
        - exclusive
        - multiple
      properties:
        bounded:
          type: integer
          minimum: 10
          maximum: 20
        exclusive:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1
        multiple:
          type: integer
          multipleOf: 5
    LabString:
      type: object
      required:
        - sized
        - coded
      properties:
        sized:
          type: string
          minLength: 3
          maxLength: 8
        coded:
          type: string
          pattern: '^[A-Z]{2}-[0-9]{4}$'
    LabTraitCheck:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[A-Z]{3}-[0-9]{3}$'
    LabArray:
      type: object
      required:
        - bag
        - distinct
      properties:
        bag:
          type: array
          minItems: 2
          maxItems: 4
          items:
            type: string
        distinct:
          type: array
          uniqueItems: true
          items:
            type: integer
    LabFormats:
      type: object
      required:
        - day
        - moment
        - clock
        - span
        - mail
        - identifier
        - host
      properties:
        day:
          type: string
          format: date
        moment:
          type: string
          format: date-time
        clock:
          type: string
          format: time
        span:
          type: string
          format: duration
        mail:
          type: string
          format: email
        identifier:
          type: string
          format: uuid
        host:
          type: string
          format: hostname
    LabEnumConst:
      type: object
      required:
        - color
        - version
      properties:
        color:
          type: string
          enum:
            - red
            - green
            - blue
        version:
          type: string
          const: v2
    LabClosed:
      type: object
      additionalProperties: false
      required:
        - known
      properties:
        known:
          type: string
    LabPresence:
      type: object
      required:
        - mandatory
      properties:
        mandatory:
          type: string
        nullableField:
          type: string
          nullable: true
        optionalField:
          type: string
        withDefault:
          type: string
          default: fallback
    LabMap:
      type: object
      required:
        - label
      properties:
        label:
          type: string
        counts:
          type: object
          additionalProperties:
            type: integer
    LabUnion:
      type: object
      required:
        - value
      properties:
        value:
          oneOf:
            - type: string
            - type: integer
    LabInner:
      type: object
      required:
        - label
      properties:
        label:
          type: string
        weight:
          type: number
    LabNested:
      type: object
      required:
        - title
        - inner
        - items
      properties:
        title:
          type: string
        inner:
          $ref: '#/components/schemas/LabInner'
        items:
          type: array
          items:
            $ref: '#/components/schemas/LabInner'
    LabVariantItem:
      type: object
      required:
        - name
        - secret
      properties:
        name:
          type: string
          description: A plain field that round-trips both ways.
        secret:
          type: string
          writeOnly: true
          description: >-
            Accepted on create, never present in any read response. Exercises
            the writeOnly split into the WritableData variant of a class that is
            nested INSIDE a collection.
        serverId:
          type: string
          readOnly: true
          description: >-
            Server-managed: present in reads, ignored if a client sends it.
            Exercises the readOnly split for a nested-in-collection class.
    LabNestedVariant:
      type: object
      required:
        - title
        - items
      properties:
        title:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/LabVariantItem'
    LabClosedInner:
      type: object
      additionalProperties: false
      required:
        - known
      properties:
        known:
          type: string
    LabClosedNest:
      type: object
      required:
        - inner
        - items
      properties:
        inner:
          $ref: '#/components/schemas/LabClosedInner'
        items:
          type: array
          items:
            $ref: '#/components/schemas/LabClosedInner'
    LabPriority:
      type: string
      enum:
        - low
        - medium
        - high
      description: A named string enum component, generated as a backed enum class.
    LabBackedEnum:
      type: object
      required:
        - priority
      properties:
        priority:
          $ref: '#/components/schemas/LabPriority'
    LabBase:
      type: object
      required:
        - baseField
      properties:
        baseField:
          type: string
    LabAllOf:
      allOf:
        - $ref: '#/components/schemas/LabBase'
        - type: object
          required:
            - extraField
          properties:
            extraField:
              type: integer
    LabCircle:
      type: object
      required:
        - kind
        - radius
      properties:
        kind:
          type: string
          const: circle
        radius:
          type: number
          exclusiveMinimum: 0
    LabSquare:
      type: object
      required:
        - kind
        - side
      properties:
        kind:
          type: string
          const: square
        side:
          type: number
          exclusiveMinimum: 0
    LabShape:
      oneOf:
        - $ref: '#/components/schemas/LabCircle'
        - $ref: '#/components/schemas/LabSquare'
      discriminator:
        propertyName: kind
        mapping:
          circle: '#/components/schemas/LabCircle'
          square: '#/components/schemas/LabSquare'
    LabRefPayload:
      type: object
      required:
        - note
        - amount
      properties:
        note:
          type: string
          minLength: 1
        amount:
          type: integer
          minimum: 1
    LabQueryEcho:
      type: object
      required:
        - tier
        - count
        - code
      properties:
        tier:
          type: string
        count:
          type: integer
        code:
          type: string
    LabDelimitedEcho:
      type: object
      required:
        - csv
        - ssv
        - psv
      properties:
        csv:
          type: array
          items:
            type: integer
        ssv:
          type: array
          items:
            type: string
        psv:
          type: array
          items:
            type: string
    LabDeepFilterEcho:
      type: object
      required:
        - gte
        - lte
      properties:
        gte:
          type: integer
        lte:
          type: integer
        color:
          type: string
    LabPathEcho:
      type: object
      required:
        - score
      properties:
        score:
          type: integer
    LabHeaderEcho:
      type: object
      required:
        - token
      properties:
        token:
          type: string
    LabSecureEcho:
      type: object
      required:
        - ok
        - op
      properties:
        ok:
          type: boolean
        op:
          type: string
    LabAnyOf:
      type: object
      required:
        - value
      properties:
        value:
          anyOf:
            - type: boolean
            - type: integer
    LabUnionSelector:
      type: object
      required:
        - want
      properties:
        want:
          type: string
          enum:
            - circle
            - square
    LabVehicleBase:
      type: object
      required:
        - vehicleType
      properties:
        vehicleType:
          type: string
      discriminator:
        propertyName: vehicleType
        mapping:
          car: '#/components/schemas/LabCar'
          boat: '#/components/schemas/LabBoat'
    LabCar:
      allOf:
        - $ref: '#/components/schemas/LabVehicleBase'
        - type: object
          required:
            - wheels
          properties:
            wheels:
              type: integer
              minimum: 3
    LabBoat:
      allOf:
        - $ref: '#/components/schemas/LabVehicleBase'
        - type: object
          required:
            - draft
          properties:
            draft:
              type: number
              exclusiveMinimum: 0
    LabTuple:
      type: object
      required:
        - pair
      properties:
        pair:
          type: array
          prefixItems:
            - type: string
            - type: integer
              minimum: 0
    LabInlineShape:
      oneOf:
        - type: object
          required:
            - petType
            - bark
          properties:
            petType:
              type: string
              const: dog
            bark:
              type: string
        - type: object
          required:
            - petType
            - meow
          properties:
            petType:
              type: string
              const: cat
            meow:
              type: string
      discriminator:
        propertyName: petType
    LabStylesEcho:
      type: object
      required:
        - page
      properties:
        page:
          type: integer
        ids:
          type: array
          items:
            type: integer
    LabCookieEcho:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
    LabInt64:
      type: object
      required:
        - ledger
      properties:
        ledger:
          type: integer
          format: int64
          minimum: 1
          maximum: 9000000000000000000
    LabLooseUnion:
      type: object
      required:
        - payload
      properties:
        payload:
          oneOf:
            - type: object
              required:
                - alpha
              properties:
                alpha:
                  type: string
            - type: object
              required:
                - beta
              properties:
                beta:
                  type: integer
    LabDualStatusEcho:
      type: object
      required:
        - state
      properties:
        state:
          type: string
  requestBodies:
    Pet:
      description: Pet object that needs to be added to the store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Pet'
        application/xml:
          schema:
            $ref: '#/components/schemas/Pet'
    UserArray:
      description: List of user object
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/User'
    LabRefBody:
      description: A component request body that wraps a schema $ref (#110).
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LabRefPayload'
    LabSharedBody:
      description: >-
        A component request body whose schema is an INLINE object (not a $ref),
        referenced by 2+ operations. The generator emits ONE shared
        LabSharedBodyRequestData class (#110).
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - sku
              - qty
            properties:
              sku:
                type: string
                pattern: '^SKU-[0-9]{3}$'
              qty:
                type: integer
                minimum: 1
  responses:
    LabRefResponse:
      description: A component response that wraps a schema $ref (#116).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LabRefPayload'
    LabSharedResponse:
      description: >-
        A component response whose schema is an INLINE object (not a $ref),
        referenced by 2+ operations. The generator emits ONE shared
        LabSharedResponseResponseData class (#116).
      content:
        application/json:
          schema:
            type: object
            required:
              - sku
              - qty
            properties:
              sku:
                type: string
              qty:
                type: integer
  securitySchemes:
    petstore_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://petstore3.swagger.io/oauth/authorize
          scopes:
            "write:pets": modify pets in your account
            "read:pets": read your pets
    api_key:
      type: apiKey
      name: api_key
      in: header
    pet_upload_key:
      type: apiKey
      name: X-API-Key
      in: header
    lab_session:
      type: apiKey
      name: X-Lab-Session
      in: header
    lab_team:
      type: apiKey
      name: X-Lab-Team
      in: header
