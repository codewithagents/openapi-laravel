openapi: 3.0.3
info:
  title: API Error Demo
  version: 1.0.0
paths:
  /pets/{petId}:
    get:
      tags:
        - pets
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The pet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetError'
    put:
      tags:
        - pets
      operationId: updatePet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: The updated pet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: The update was rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetError'
        '404':
          description: Pet not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetError'
  /pets:
    post:
      tags:
        - pets
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: The created pet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: The request was malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestProblem'
        '404':
          description: A referenced resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
    PetError:
      type: object
      required: [message]
      properties:
        message:
          type: string
    BadRequestProblem:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
    NotFoundProblem:
      type: object
      required: [resource]
      properties:
        resource:
          type: string
