openapi: 3.1.0
info:
  title: Fidelity Report Fixture
  version: 1.0.0
paths:
  /pets:
    get:
      tags:
        - pet
      operationId: listPets
      parameters:
        - name: tags
          in: query
          schema:
            type: array
            items:
              type: string
        - name: session
          in: cookie
          schema:
            type: string
      responses:
        '200':
          description: ok
          headers:
            X-Rate-Limit:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
      callbacks:
        onData:
          '{$request.body#/url}':
            post:
              responses:
                '200':
                  description: ok
  /pets/{petId}:
    get:
      tags:
        - pet
      operationId: showPet
      parameters:
        - name: petId
          in: path
          required: true
          style: matrix
          schema:
            type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      type: object
      properties:
        id:
          type: integer
          format: int64
        kind:
          oneOf:
            - $ref: '#/components/schemas/Cat'
            - $ref: '#/components/schemas/Dog'
        forbidden:
          not:
            type: string
      patternProperties:
        '^meta-':
          type: string
      additionalProperties:
        $ref: '#/components/schemas/Cat'
    Cat:
      type: object
      properties:
        name:
          type: string
    Dog:
      type: object
      properties:
        name:
          type: string
