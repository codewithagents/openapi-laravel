name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: "Tests (PHP ${{ matrix.php }}, ${{ matrix.deps }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Laravel coverage follows composer resolution per PHP version:
        # Composer 2.10+ skips framework versions with known security
        # advisories, so lowest currently resolves Laravel 12 (testbench 10)
        # on every leg; highest resolves Laravel 12 on PHP 8.2 and Laravel 13
        # (testbench 11) on PHP 8.3/8.4, since illuminate 13 requires PHP ^8.3.
        php: ['8.2', '8.3', '8.4']
        deps: ['lowest', 'highest']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer update --${{ matrix.deps == 'lowest' && 'prefer-lowest' || 'prefer-stable' }} --no-interaction --no-progress
      - name: Pest
        run: composer test

  static-analysis:
    name: Static analysis & style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - name: Pint (style)
        run: composer lint
      - name: PHPStan (max)
        run: composer stan
      - name: Type coverage (100%)
        run: composer test:type

  mutation:
    name: Mutation testing (Pest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - name: Pest mutation testing
        run: composer test:mutate

  hygiene:
    name: Dependency hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2, composer-unused, composer-require-checker
      - run: composer install --no-interaction --no-progress
      - name: Unused dependencies
        run: composer-unused
      - name: Missing / undeclared dependencies
        run: composer-require-checker check --config-file=composer-require-checker.json
      - name: Security advisories (composer audit)
        run: composer audit

  architecture:
    name: Architecture (deptrac)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - name: Deptrac (architecture boundaries)
        run: composer deptrac
