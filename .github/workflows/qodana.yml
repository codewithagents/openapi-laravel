# Qodana code quality (JetBrains) for openapi-laravel.
#
# Informational only: this workflow reports findings to the GitHub Security tab
# (via SARIF) and is NOT part of the required status checks, so it never blocks a
# merge. continue-on-error keeps the job green even when Qodana reports problems.
#
# MAINTAINER, one-time manual step to unlock the Qodana Cloud dashboard:
#   1. Create a project at https://qodana.cloud
#   2. Copy the project token and add it as a repository secret named QODANA_TOKEN
#      (Settings -> Secrets and variables -> Actions -> New repository secret).
# Without the token the workflow still runs and reports to GitHub; it just skips
# the Qodana Cloud upload.
name: Qodana

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write
  checks: write

jobs:
  qodana:
    name: Qodana code quality
    runs-on: ubuntu-latest
    # Informational gate: do not fail the build or block merges on findings.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          # Check out the actual PR commit, not the synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
          # A full history lets Qodana attribute findings and diff against the base.
          fetch-depth: 0

      # Code coverage for the Qodana report (#89). Qodana for PHP ingests a
      # PHPUnit Clover XML report from the default coverage directory
      # <project-root>/.qodana/code-coverage, so Pest writes it there and the
      # scan picks it up without extra args. Informational like the rest of
      # this workflow: every coverage step is continue-on-error, so a failure
      # here only loses the coverage number, never the scan or the merge.
      - uses: shivammathur/setup-php@v2
        continue-on-error: true
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        continue-on-error: true
        run: composer install --no-interaction --no-progress

      - name: Pest coverage (Clover for Qodana)
        continue-on-error: true
        # Exclude the slow group (the generated-output Pint/PHPStan gates, about
        # two thirds of suite runtime); the fast suite already exercises the
        # same src/ paths, so the coverage number stays representative.
        run: php -d memory_limit=512M vendor/bin/pest --exclude-group=slow --coverage-clover .qodana/code-coverage/coverage.xml

      - name: Qodana scan
        uses: JetBrains/qodana-action@v2026.1
        with:
          use-caches: true
          upload-result: true
          # Permissive: never let the analysis itself fail the step.
          args: --fail-threshold,1000000
        env:
          # Optional. If the secret is unset the action runs without Cloud upload.
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: 'https://qodana.cloud'

      - name: Upload SARIF to GitHub code scanning
        # Surface findings in the Security tab. Guarded so a missing SARIF (for
        # example if the scan was skipped) does not hard-fail the workflow.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
