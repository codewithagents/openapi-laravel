name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create tags and releases
  pull-requests: write # create and update release PRs

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      # Prepares releases by opening and updating a release PR, then on merge
      # tags the release and creates a GitHub release. Packagist auto-updates
      # from the tag via its GitHub webhook, so no publish step is needed here.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
